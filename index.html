<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Budget Tracker</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>

    <main class="container">

        <header>

            <h1>your gastos tracker</h1>

            <p id="date"></p>

        </header>


        <!-- SETUP -->

        <section
            id="setup"
            class="card hidden"
        >

            <h2>connect your sheet!</h2>

            <p>
                paste your gsheet's Apps Script URL (ask wax how to connect)
            </p>

            <input
                type="url"
                id="scriptUrl"
                placeholder="https://script.google.com/..."
            >

            <button id="connectButton">

                connect

            </button>

        </section>


        <!-- TRANSACTION FORM -->

        <section
            id="transactionForm"
            class="card hidden"
        >

            <h2>add transaction</h2>


            <label>

                amount

                <input
                    type="number"
                    id="amount"
                    placeholder="₱0.00"
                    min="0"
                    step="0.01"
                >

            </label>


            <label>

                description

                <input
                    type="text"
                    id="description"
                    placeholder=""
                >

            </label>


            <label>

                category

                <select id="category">

                    <option value="">
                        
                    </option>

                    <option value="Transportation">
                        transportation
                    </option>

                    <option value="Food">
                        food
                    </option>

                    <option value="Dorm / Housing">
                        dorm/housing
                    </option>

                    <option value="School">
                        school
                    </option>

                    <option value="Load / Internet">
                        load/internet
                    </option>

                    <option value="Personal Care">
                        personal care
                    </option>

                    <option value="Health">
                        health
                    </option>

                    <option value="Clothing">
                        clothing
                    </option>

                    <option value="Leisure">
                        leisure
                    </option>

                    <option value="Gifts / Miscellaneous">
                        gifts/misc
                    </option>

                    <option value="Savings">
                        savings
                    </option>

                    <option value="Money In / Allowance">
                        money in/allowance
                    </option>

                </select>

            </label>


            <label>

                mode of payment

                <select id="payment">

                    <option value="">
                        
                    </option>

                    <option value="Cash">
                        cash
                    </option>

                    <option value="GCash">
                        gcash
                    </option>

                    <option value="Beep Card">
                        beep card
                    </option>
                    
                    <option value="Landbank">
                        landbank
                    </option>

                    <option value="Maya">
                        maya
                    </option>

                </select>

            </label>


            <label>

                transaction

                <select id="type">

                    <option value="Cash Out">
                        cash out
                    </option>

                    <option value="Cash In">
                        cash in
                    </option>

                </select>

            </label>


            <button id="addButton">

                add transaction

            </button>


            <p
                id="message"
                class="message"
            ></p>


        </section>


        <!-- SETTINGS -->

        <button
            id="settingsButton"
            class="settings"
        >

            reset gsheet link?

        </button>


    </main>


    <script src="script.js"></script>

</body>

</html>
