<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Budget Tracker</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>

    <main class="container">

        <header>

            <h1>Budget</h1>

            <p id="date"></p>

        </header>


        <!-- SETUP -->

        <section
            id="setup"
            class="card hidden"
        >

            <h2>Connect your sheet</h2>

            <p>
                Paste your Google Apps Script URL.
            </p>

            <input
                type="url"
                id="scriptUrl"
                placeholder="https://script.google.com/..."
            >

            <button id="connectButton">

                Connect

            </button>

        </section>


        <!-- TRANSACTION FORM -->

        <section
            id="transactionForm"
            class="card hidden"
        >

            <h2>Add Transaction</h2>


            <label>

                Description

                <input
                    type="text"
                    id="description"
                    placeholder="What was it?"
                >

            </label>


            <label>

                Amount

                <input
                    type="number"
                    id="amount"
                    placeholder="0.00"
                    min="0"
                    step="0.01"
                >

            </label>


            <label>

                Category

                <select id="category">

                    <option value="">
                        Select category
                    </option>

                    <option value="Food">
                        Food
                    </option>

                    <option value="Transportation">
                        Transportation
                    </option>

                    <option value="School">
                        School
                    </option>

                    <option value="Shopping">
                        Shopping
                    </option>

                    <option value="Entertainment">
                        Entertainment
                    </option>

                    <option value="Bills">
                        Bills
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </label>


            <label>

                Mode of Payment

                <select id="payment">

                    <option value="">
                        Select payment
                    </option>

                    <option value="Cash">
                        Cash
                    </option>

                    <option value="Landbank">
                        Landbank
                    </option>

                    <option value="GCash">
                        GCash
                    </option>

                    <option value="Maya">
                        Maya
                    </option>

                    <option value="Beep Card">
                        Beep Card
                    </option>

                </select>

            </label>


            <label>

                Transaction

                <select id="type">

                    <option value="Cash Out">
                        Cash Out
                    </option>

                    <option value="Cash In">
                        Cash In
                    </option>

                </select>

            </label>


            <button id="addButton">

                Add Transaction

            </button>


            <p
                id="message"
                class="message"
            ></p>


        </section>


        <!-- SETTINGS -->

        <button
            id="settingsButton"
            class="settings"
        >

            Settings

        </button>


    </main>


    <script src="script.js"></script>

</body>

</html>
